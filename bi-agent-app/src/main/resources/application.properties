quarkus.http.port=8080

# Database connection
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${BI_DB_URL:jdbc:postgresql://localhost:5432/bi}
quarkus.datasource.username=${BI_DB_USERNAME:bi_user}
quarkus.datasource.password=${BI_DB_PASSWORD:bi_password}

# LLM provider (LangChain4j/OpenAI)
bi.ai.api-key=${BI_AI_API_KEY:replace-with-your-key}
bi.ai.model=${BI_AI_MODEL:gpt-4o-mini}
bi.ai.temperature=${BI_AI_TEMPERATURE:0.1}

quarkus.log.category."com.yourcompany.bi".level=INFO
